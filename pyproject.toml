[project]
name = "my_tool"
version = "0.1.0"
description = "One sentence: what this tool makes, and for whom."
readme = "README.md"
requires-python = ">=3.9"            # Rhino 8 runs CPython 3.9: the core must too
dependencies = ["compas>=2.0"]

# Tools for developing, never shipped to users.
[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_tool"]

[tool.pytest.ini_options]
testpaths = ["tests"]                # the spec; scripts/tests checks the build scripts

# Read by scripts/ghuser.py and scripts/dev.py.
[tool.ghuser]
builder = "1.2.1"                                         # ghuser-builder release: image + dev tools
builder-repo = "https://github.com/rccn-dev/ghuser-builder"
yak-name = "my-tool"                                      # the Rhino package; PACKAGE in every code.py
yak-include = ["src/my_tool:lib/my_tool"]                 # the core travels inside the .yak
