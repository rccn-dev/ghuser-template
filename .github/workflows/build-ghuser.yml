# Build, verify and package the Grasshopper components: the same
# `uv run scripts/ghuser.py` as on your laptop, so the same image and command.
#
# Every push: build + verify (a broken component fails here, not in Rhino).
# A tag v1.2.3: also attach the .yak and the .ghuser files to a GitHub Release.
name: build-ghuser

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write            # to attach files to a Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run scripts/ghuser.py     # builds the pinned image first; the version comes from the tag
      - uses: actions/upload-artifact@v4
        with:
          name: ghuser
          path: dist
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.yak
            dist/ghuser/*.ghuser
